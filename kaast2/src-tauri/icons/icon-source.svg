<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- KAAST 2 app mark: brass "K2" on indigo. Source for `npx tauri icon`
       (see src-tauri/README.md). Pure paths, no fonts, so it renders the same everywhere. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2766"/>
      <stop offset="1" stop-color="#16133F"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="290" x2="0" y2="734" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECCB74"/>
      <stop offset="0.55" stop-color="#C99A2E"/>
      <stop offset="1" stop-color="#A67C1F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="104" x2="0" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECCB74"/>
      <stop offset="1" stop-color="#A67C1F"/>
    </linearGradient>
    <clipPath id="k"><rect x="176" y="300" width="360" height="424"/></clipPath>
    <clipPath id="two"><rect x="560" y="300" width="330" height="424"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#bg)"/>
  <rect x="104" y="104" width="816" height="816" rx="160" fill="none" stroke="url(#rim)" stroke-width="14" opacity="0.85"/>
  <g fill="none" stroke="url(#brass)" stroke-linecap="butt">
    <!-- K -->
    <g clip-path="url(#k)">
      <line x1="222" y1="260" x2="222" y2="760" stroke-width="92"/>
      <line x1="200" y1="672" x2="520" y2="262" stroke-width="86"/>
      <line x1="318" y1="500" x2="536" y2="772" stroke-width="92"/>
    </g>
    <!-- 2 -->
    <path clip-path="url(#two)" stroke-width="86" stroke-linejoin="miter"
          d="M 600 414 C 600 344 650 300 712 300 C 780 300 826 348 826 412 C 826 470 790 506 746 550 L 628 681 L 860 681"/>
  </g>
</svg>
