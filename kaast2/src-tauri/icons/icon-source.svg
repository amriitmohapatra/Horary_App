<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Astro-Amriit app mark: a brass "A" with a four-pointed star, on indigo.
       Pure paths, no fonts, so it renders the same everywhere. Regenerate the icon set with
       `npx tauri icon src-tauri/icons/icon-source.svg -o <tmp dir>` and copy the 7 files
       listed in tauri.conf.json > bundle > icon (plus 64x64.png, icon.png). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2766"/>
      <stop offset="1" stop-color="#16133F"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="250" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECCB74"/>
      <stop offset="0.55" stop-color="#C99A2E"/>
      <stop offset="1" stop-color="#A67C1F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="104" x2="0" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECCB74"/>
      <stop offset="1" stop-color="#A67C1F"/>
    </linearGradient>
    <clipPath id="a"><rect x="150" y="300" width="560" height="460"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#bg)"/>
  <rect x="104" y="104" width="816" height="816" rx="160" fill="none" stroke="url(#rim)" stroke-width="14" opacity="0.85"/>
  <!-- A: two legs meeting in a flat apex, plus a crossbar -->
  <g clip-path="url(#a)" fill="none" stroke="url(#brass)" stroke-linecap="butt">
    <path d="M 210 800 L 430 260 L 650 800" stroke-width="100" stroke-linejoin="miter" stroke-miterlimit="2"/>
    <line x1="300" y1="600" x2="560" y2="600" stroke-width="78"/>
  </g>
  <!-- four-pointed star -->
  <path fill="url(#brass)"
        d="M 740 250 C 750 320 770 340 840 350 C 770 360 750 380 740 450 C 730 380 710 360 640 350 C 710 340 730 320 740 250 Z"/>
</svg>
