# Desktop installers for Astro-Amriit (codename KAAST 2; source in kaast2/)
# (PLAN.md slice 8b, ARCHITECTURE.md §6, ADR-9).
# Builds unsigned installers (decision D10) for devices that never go online:
#   Windows x64 : "Astro-Amriit Setup vX.Y.Z.exe" (NSIS) and "Astro-Amriit vX.Y.Z.msi",
#                 both with the WebView2 OFFLINE installer embedded
#   macOS       : "Astro-Amriit vX.Y.Z.dmg" (universal: Intel + Apple Silicon, ad-hoc signed)
# plus SHA256SUMS.txt and a ready-to-copy "USB kit" artefact.
# Runs only by hand (Actions tab -> kaast2-desktop -> Run workflow) or on a
# tag kaast2-vX.Y.Z. It never publishes a release; download the artefacts.
name: kaast2-desktop
on:
  workflow_dispatch:
  push:
    tags: ['kaast2-v*']

permissions:
  contents: read

concurrency:
  group: kaast2-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: installers (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            rust-targets: x86_64-pc-windows-msvc
            tauri-target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            label: macos-universal
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-target: universal-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
        working-directory: kaast2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaast2/package-lock.json

      - name: Rust (stable) and targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.rust-targets }}
          rustc --version && cargo --version

      - name: Version (and tag check)
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "kaast2-v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match kaast2/package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      - name: Build installers (tauri build; runs `npm run build` first)
        # `-- --locked`: build exactly the crate versions in src-tauri/Cargo.lock.
        run: npx tauri build --ci --target ${{ matrix.tauri-target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Offline check - the bundled page references no remote host
        run: |
          # Only XML namespace identifiers (w3.org) may appear; they are never fetched.
          # -I skips binary files (the WASM and the ephemeris data).
          if grep -rIhoE "https?://[A-Za-z0-9.-]+" dist-site | grep -vE "^http://www\.w3\.org$" | sort -u | grep .; then
            echo "::error::dist-site references a remote host (see above)"; exit 1
          fi
          echo "dist-site: no remote hosts"

      - name: Collect, rename, checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUNDLE: src-tauri/target/${{ matrix.tauri-target }}/release/bundle
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$BUNDLE"/nsis/*-setup.exe "$OUT/Astro-Amriit Setup v$VERSION.exe"
            cp "$BUNDLE"/msi/*.msi "$OUT/Astro-Amriit v$VERSION.msi"
            cd "$OUT" && sha256sum *.exe *.msi > SHA256SUMS.txt
            # The embedded WebView2 offline installer is ~200 MB; a small
            # installer means it is missing and offline installs would fail.
            SIZE=$(stat -c %s "Astro-Amriit Setup v$VERSION.exe")
            if (( SIZE < 150000000 )); then echo "::error::NSIS installer is only $SIZE bytes - WebView2 offline installer not embedded?"; exit 1; fi
          else
            cp "$BUNDLE"/dmg/*.dmg "$OUT/Astro-Amriit v$VERSION.dmg"
            cd "$OUT" && shasum -a 256 *.dmg > SHA256SUMS.txt
          fi
          ls -la "$OUT"; cat SHA256SUMS.txt
          { echo "### ${{ matrix.label }}"; echo '```'; ls -la; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      # ---- Smoke tests on the runner (evidence only; they do not replace a
      # test on a real offline machine). continue-on-error until the first
      # green run has been reviewed; then the lead may make them blocking.
      - name: Smoke (Windows) - silent install, launch, screenshot, uninstall
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ runner.temp }}/out
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Filter 'Astro-Amriit Setup v*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Depth 3 -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like '*Astro-Amriit*' -and $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw 'installed exe not found under LOCALAPPDATA' }
          "installed: $($exe.FullName)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\smoke" | Out-Null
          $bmp.Save("$env:RUNNER_TEMP\smoke\windows.png")
          Stop-Process -Id $p.Id -Force
          $un = Get-ChildItem -Path $exe.DirectoryName -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($un) { Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait }
          'smoke: installed, ran 20 s, screenshot taken, uninstalled' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Smoke (macOS) - mount, check architectures, launch, screenshot
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/out
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" Astro-Amriit\ v*.dmg
          APP="$RUNNER_TEMP/Astro-Amriit.app"; cp -R "$MNT/Astro-Amriit.app" "$APP"; hdiutil detach "$MNT"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          { echo '```'; lipo -archs "$APP/Contents/MacOS/$BIN"; codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          lipo -archs "$APP/Contents/MacOS/$BIN" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/$BIN" | grep -q arm64
          open "$APP"; sleep 20
          pgrep -f "$APP/Contents/MacOS/$BIN" >/dev/null || { echo "app not running"; exit 1; }
          mkdir -p "$RUNNER_TEMP/smoke"; screencapture -x "$RUNNER_TEMP/smoke/macos.png" || true
          pkill -f "$APP/Contents/MacOS/$BIN" || true
          echo 'smoke: universal binary, launched, ran 20 s' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: kaast2-smoke-${{ matrix.label }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 30

  usb-kit:
    name: USB kit (everything for the stick)
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kaast2/package.json
            kaast2/docs/install
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: parts
      - name: Assemble the kit
        id: kit
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./kaast2/package.json').version")
          KIT="Astro-Amriit v$VERSION - USB kit"
          mkdir -p "kit/$KIT"
          cp parts/*/*.exe parts/*/*.msi parts/*/*.dmg "kit/$KIT/"
          cp kaast2/docs/install/USB_INSTALL_GUIDE.md "kit/$KIT/READ ME FIRST - install guide.txt"
          cd "kit/$KIT"
          sha256sum *.exe *.msi *.dmg > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -la
          echo "name=astro-amriit-usb-kit-v$VERSION" >> "$GITHUB_OUTPUT"
          { echo '### USB kit'; echo '```'; ls -la; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.kit.outputs.name }}
          path: kit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
